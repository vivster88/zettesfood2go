    <!-- Top-level Extension & Third-Party Wallet Guard -->
    <script>
      (function() {
        var isExtensionError = function(msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || msg.toString());
          return /metamask|ethereum|web3|wallet|failed to connect to metamask|chrome-extension|moz-extension/i.test(str);
        };

        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isExtensionError(arguments[i])) {
              return;
            }
          }
          origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isExtensionError(arguments[i])) {
              return;
            }
          }
          origConsoleWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(e) {
          if (isExtensionError(e.reason)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(e) {
          if (isExtensionError(e.message) || isExtensionError(e.error) || (e.filename && /extension/i.test(e.filename))) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return false;
          }
        }, true);

        var origOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          if (isExtensionError(msg) || isExtensionError(error) || (url && /extension/i.test(url))) {
            return true; // suppresses the error
          }
          if (origOnError) {
            return origOnError.apply(this, arguments);
          }
          return false;
        };
      })();
    </script>
